# ------------------------- Specialize Agent -------------------------------------------------- # 

agent-6:
    build: ./agent/specialize_agent
    command: ["node", "specialize.js"] # had to add a command so that i dont change the starting code for the others agents 
    container_name: cs-agent-6
    environment:
      - AGENT_ID=agent-2              
      - AGENT_LABEL=Host-Secondary     
      - BACKEND_URL=http://backend:3002 
      - REPORT_INTERVAL=10000            
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cs-network

networks:
  cs-network:
    driver: bridge

