version: '3.8'

# ─────────────────────────────────────────────
# Citadel — Distributed Monitoring Stack
#
# Starts:
#   - central backend (aggregates all agent reports)
#   - agent-1 (general metrics — Host-Primary)
#   - agent-2 (general metrics — Host-Secondary, fault tolerance demo)
#   - agent-3 (specialized network intrusion detection)
#
# Run: docker-compose up --build
# Stop: docker-compose down
# ─────────────────────────────────────────────

services:

  # ── Central Backend ──
  backend:
    build: ./server
    container_name: cs-backend
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - cs-network

  # ── Monitoring Agent 1 ──
  agent-1:
    build: ./agent
    container_name: cs-agent-1
    environment:
      - AGENT_ID=agent-1
      - AGENT_LABEL=Host-Primary
      - BACKEND_URL=http://backend:3002
      - REPORT_INTERVAL=10000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cs-network

  # ── Monitoring Agent 2 ──
  agent-2:
    build: ./agent
    container_name: cs-agent-2
    environment:
      - AGENT_ID=agent-2
      - AGENT_LABEL=Host-Secondary
      - BACKEND_URL=http://backend:3002
      - REPORT_INTERVAL=10000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cs-network

  # ── Specialized Network Intrusion Detection Agent ──
  agent-3:
    build: ./agent
    command: ["node", "network_agent.js"]
    container_name: cs-agent-3
    environment:
      - AGENT_ID=agent-3
      - AGENT_LABEL=Network-Intrusion-Detector
      - BACKEND_URL=http://backend:3002
      - REPORT_INTERVAL=10000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cs-network

networks:
  cs-network:
    driver: bridge