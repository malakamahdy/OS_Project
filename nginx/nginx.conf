# ─────────────────────────────────────────────────────────────────────────────
# Citadel — NGINX Load Balancer
# Uses Docker's internal DNS (127.0.0.11) to resolve container names.
# ─────────────────────────────────────────────────────────────────────────────

upstream citadel_backends {
    least_conn;
    server cs-backend-1:3010;
    server cs-backend-2:3011;
    server cs-backend-3:3012;
}

server {
    listen 3002;

    # Use Docker's internal DNS resolver
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    location /api/ {
        proxy_pass         http://citadel_backends;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /socket.io/ {
        proxy_pass         http://citadel_backends;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
    }

    location /health {
        proxy_pass http://citadel_backends/api/health;
    }
}